services:
  db:
    image: supabase/postgres:15.1.0.147
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 5s
      timeout: 5s
      retries: 15
    ports:
      - "${POSTGRES_PORT:-0}:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - db_data:/var/lib/postgresql/data
      # Post-migration hook: migrate.sh runs this file AFTER all init-scripts and
      # migrations complete. Sets role passwords that GoTrue + PostgREST need.
      - ./docker/postgres-init/01-set-passwords.sql:/etc/postgresql.schema.sql:ro

  gotrue:
    image: supabase/gotrue:v2.143.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 15
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: http://192.168.1.154
      API_EXTERNAL_URL: http://localhost:9000
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_LOG_LEVEL: info

  rest:
    image: postgrest/postgrest:v12.0.2
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  # Runs our SQL migrations AFTER GoTrue has initialized the auth schema.
  # GoTrue creates auth.users on its own startup; our tables FK into it.
  migrate:
    image: postgres:15
    depends_on:
      gotrue:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./supabase/migrations:/migrations:ro
    command: >
      bash -c "
        echo '=== Running app migrations ===';
        for f in $$(ls /migrations/*.sql | sort); do
          echo \"Applying: $$f\";
          psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -f $$f;
        done;
        echo '=== Migrations complete ==='
      "
    restart: "no"

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      gotrue:
        condition: service_healthy
      rest:
        condition: service_started
    volumes:
      - ./docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    # host.docker.internal resolves to the Jetson host so the backend
    # can reach Ollama (running natively with NVIDIA nvgpu acceleration).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SUPABASE_URL: http://gateway:9000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      ALLOWED_ORIGINS: http://localhost,http://192.168.1.154
      APP_ENV: local
      LOG_LEVEL: INFO
      # ── AI provider (ollama = local Jetson GPU; nvidia = NVIDIA NIM cloud) ──
      AI_PROVIDER: ${AI_PROVIDER:-hybrid}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_NIM_MODEL: ${NVIDIA_NIM_MODEL:-meta/llama-3.1-8b-instruct}
      # ── Stripe (test keys only — swap to live keys via Railway env vars for prod) ──
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_MONTHLY: ${STRIPE_PRICE_ID_MONTHLY:-}
      STRIPE_PRICE_ID_YEARLY: ${STRIPE_PRICE_ID_YEARLY:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost?checkout=success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost?checkout=cancel}
      # ── Sprint-006: Dream-to-Launch one-time purchase Stripe price IDs ──
      STRIPE_PRICE_ID_LAUNCH_BUILDER: ${STRIPE_PRICE_ID_LAUNCH_BUILDER:-}
      STRIPE_PRICE_ID_LAUNCH_PACKET_PRO: ${STRIPE_PRICE_ID_LAUNCH_PACKET_PRO:-}
      STRIPE_PRICE_ID_ADVISOR_REVIEW: ${STRIPE_PRICE_ID_ADVISOR_REVIEW:-}
      STRIPE_ONE_TIME_WEBHOOK_SECRET: ${STRIPE_ONE_TIME_WEBHOOK_SECRET:-}
      # ── Sprint-006: Admin notifications ──
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}

  frontend:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-0}:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./auth.js:/usr/share/nginx/html/auth.js:ro
      - ./api-client.js:/usr/share/nginx/html/api-client.js:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./admin.html:/usr/share/nginx/html/admin.html:ro
      - ./dream-builder.html:/usr/share/nginx/html/dream-builder.html:ro
      - ./dream-builder.js:/usr/share/nginx/html/dream-builder.js:ro
      - ./docker/nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro

  nvidia-ai:
    build:
      context: ../nvidia-ai-services
    container_name: ${COMPOSE_PROJECT_NAME:-champ-compass}-nvidia-ai
    ports:
      - "${MORPHEUS_PORT:-8410}:8010"
      - "${DOCA_PORT:-8411}:8011"
      - "${NIM_PORT:-8412}:8012"
      - "${RAPIDS_PORT:-8413}:8013"
      - "${TRITON_PORT:-8414}:8014"
      - "${NEMO_PORT:-8415}:8015"
    environment:
      OLLAMA_HOST: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-deepseek-r1:1.5b}"
      OLLAMA_NUM_GPU: "0"
      OLLAMA_TIMEOUT: "20"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  db_data:
