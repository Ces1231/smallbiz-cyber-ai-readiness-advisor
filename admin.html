<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Champtron Systems LLC</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin-search { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
    .admin-search input { flex:1; min-width:220px; border-radius:10px; border:1px solid var(--border); background:#071421; color:var(--text); padding:10px 14px; font-size:0.9rem; outline:none; }
    .admin-search input:focus { border-color:var(--cyan); }
    .admin-search input::placeholder { color:var(--muted); }
    .action-btn { background:rgba(34,211,238,.12); color:var(--cyan); border:1px solid rgba(34,211,238,.3); border-radius:6px; padding:4px 10px; font-size:0.8rem; cursor:pointer; white-space:nowrap; }
    .action-btn:hover { background:rgba(34,211,238,.22); }
    .edit-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:1000; }
    .edit-overlay.hidden { display:none; }
    .edit-card { background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:28px 28px 24px; width:100%; max-width:420px; position:relative; }
    .edit-card h3 { margin:0 0 4px; font-size:1.1rem; }
    .edit-card .edit-email { color:var(--cyan); font-size:0.85rem; margin:0 0 20px; word-break:break-all; }
    .edit-card label { display:block; font-size:0.85rem; color:var(--muted); margin-bottom:5px; margin-top:14px; }
    .edit-card label:first-of-type { margin-top:0; }
    .edit-card input, .edit-card select { width:100%; box-sizing:border-box; border-radius:10px; border:1px solid var(--border); background:#071421; color:var(--text); padding:10px 12px; font-size:0.9rem; outline:none; }
    .edit-card input:focus, .edit-card select:focus { border-color:var(--cyan); }
    .edit-actions { display:flex; gap:8px; margin-top:20px; flex-wrap:wrap; }
    .edit-status { font-size:0.85rem; margin-top:10px; min-height:20px; }
    .edit-status.ok { color:#4ade80; }
    .edit-status.err { color:var(--red,#f87171); }
    .edit-close { position:absolute; top:14px; right:16px; background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; line-height:1; }
    .tier-badge.free { background:rgba(255,255,255,.08); color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:2px 10px; font-size:12px; }
    .tier-badge.pro, .tier-badge.pro_annual { background:rgba(34,211,238,.15); color:var(--cyan); border:1px solid rgba(34,211,238,.3); border-radius:999px; padding:2px 10px; font-size:12px; }
    .tier-badge.admin { background:rgba(251,191,36,.15); color:#fbbf24; border:1px solid rgba(251,191,36,.3); border-radius:999px; padding:2px 10px; font-size:12px; }
  </style>
</head>
<body>
  <header class="hero" style="padding:20px 6vw">
    <nav>
      <div class="brand">
        <strong>Champtron Systems LLC</strong>
        <span>Admin Dashboard</span>
      </div>
      <span id="adminUserEmail" class="muted" style="font-size:13px;"></span>
      <button class="button secondary" onclick="Auth.logout().then(() => window.location = '/')">Logout</button>
    </nav>
  </header>

  <main style="padding:32px 6vw; max-width:1200px; margin:0 auto">
    <div id="adminGate">
      <p class="muted">Checking admin access...</p>
    </div>

    <div id="adminContent" style="display:none">

      <!-- Metrics -->
      <h2>Platform Overview</h2>
      <div class="dashboard-grid" id="metricsGrid" style="gap:16px; margin-bottom:40px;"></div>

      <!-- Users -->
      <h2 style="margin-bottom:16px;">Users</h2>

      <!-- Search + tier filter -->
      <div class="admin-search">
        <input id="adminSearchInput" type="text" placeholder="Search by email or business name…" oninput="scheduleSearch()" />
        <button class="button secondary small" onclick="applyTierFilter(null)">All</button>
        <button class="button secondary small" onclick="applyTierFilter('free')">Free</button>
        <button class="button secondary small" onclick="applyTierFilter('pro')">Pro</button>
        <button class="button secondary small" onclick="applyTierFilter('admin')">Admin</button>
      </div>

      <div style="overflow-x:auto">
        <table class="risk-table" style="width:100%">
          <thead>
            <tr>
              <th>Email</th>
              <th>Business Name</th>
              <th>Tier</th>
              <th>Assessments</th>
              <th>Member Since</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="6" class="muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      <div id="usersPagination" style="display:flex; gap:12px; margin-top:16px;"></div>
    </div>
  </main>

  <!-- Edit User Modal -->
  <div id="editOverlay" class="edit-overlay hidden">
    <div class="edit-card">
      <button class="edit-close" onclick="closeEditModal()">&#x2715;</button>
      <h3>Edit User</h3>
      <p id="editEmail" class="edit-email"></p>

      <label>Business Name</label>
      <input id="editBusinessName" type="text" placeholder="Business name" maxlength="120" />

      <label>Tier</label>
      <select id="editTier">
        <option value="free">Free</option>
        <option value="pro">Pro</option>
        <option value="pro_annual">Pro Annual</option>
        <option value="admin">Admin</option>
      </select>

      <div class="edit-actions">
        <button class="button primary" onclick="saveUser()" id="editSaveBtn">Save Changes</button>
        <button class="button secondary" onclick="resetPassword()" id="editResetBtn">Reset Password</button>
        <button class="button ghost" onclick="closeEditModal()">Cancel</button>
      </div>
      <p id="editStatus" class="edit-status"></p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="api-client.js"></script>
  <script>
    const PAGE_SIZE = 20;
    let _offset = 0;
    let _tierFilter = null;
    let _searchTimer = null;
    let _editingUserId = null;

    // ── Init ──────────────────────────────────────────────────────────────────

    async function loadAdminDashboard() {
      const gate = document.getElementById('adminGate');
      const content = document.getElementById('adminContent');
      let profile;
      try {
        profile = await ApiClient.get('/profiles/me');
      } catch (err) {
        gate.innerHTML = '<p class="muted">Unable to verify access. <a href="/">Go to main tool</a>.</p>';
        return;
      }
      if (profile.tier !== 'admin') {
        gate.innerHTML = '<p class="muted">Admin access required. <a href="/">Go to main tool</a>.</p>';
        return;
      }
      gate.style.display = 'none';
      content.style.display = 'block';
      document.getElementById('adminUserEmail').textContent = Auth.getUser()?.email || '';
      await Promise.all([loadMetrics(), loadUsers(0)]);
    }

    // ── Metrics ───────────────────────────────────────────────────────────────

    async function loadMetrics() {
      const grid = document.getElementById('metricsGrid');
      try {
        const m = await ApiClient.get('/admin/metrics');
        const cards = [
          { label: 'Total Users',            value: m.total_users },
          { label: 'Free Users',             value: m.free_users },
          { label: 'Pro Users',              value: m.pro_users },
          { label: 'Total Assessments',      value: m.total_assessments },
          { label: 'Assessments This Month', value: m.assessments_this_month },
          { label: 'AI Requests This Month', value: m.ai_advice_requests_this_month },
          { label: 'Avg Overall Score',      value: `${m.average_overall_score}%` },
          { label: 'Top Industry',           value: m.most_common_industry },
        ];
        grid.innerHTML = cards.map(c => `
          <div class="score-card" style="text-align:center;padding:20px 16px">
            <div style="font-size:2rem;font-weight:700;color:var(--cyan)">${c.value}</div>
            <div class="muted" style="font-size:13px;margin-top:6px">${c.label}</div>
          </div>
        `).join('');
      } catch (err) {
        grid.innerHTML = '<p class="muted">Unable to load metrics.</p>';
      }
    }

    // ── User List ─────────────────────────────────────────────────────────────

    function scheduleSearch() {
      clearTimeout(_searchTimer);
      _searchTimer = setTimeout(() => loadUsers(0), 350);
    }

    function applyTierFilter(tier) {
      _tierFilter = tier;
      loadUsers(0);
    }

    async function loadUsers(offset) {
      _offset = offset;
      const tbody = document.getElementById('usersTableBody');
      const pager = document.getElementById('usersPagination');
      tbody.innerHTML = '<tr><td colspan="6" class="muted">Loading…</td></tr>';

      const search = document.getElementById('adminSearchInput').value.trim();
      const qs = new URLSearchParams({ limit: PAGE_SIZE, offset });
      if (_tierFilter) qs.set('tier', _tierFilter);
      if (search) qs.set('search', search);

      try {
        const { data, meta } = await ApiClient.get(`/admin/users?${qs}`);
        if (!data.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="muted">No users found.</td></tr>';
          pager.innerHTML = '';
          return;
        }

        tbody.innerHTML = data.map(u => `
          <tr>
            <td style="font-size:13px;">${u.email || '<span class="muted">—</span>'}</td>
            <td>${u.business_name || '<span class="muted">—</span>'}</td>
            <td><span class="tier-badge ${u.tier}">${u.tier}</span></td>
            <td>${u.assessments_this_month}</td>
            <td style="font-size:13px;">${new Date(u.created_at).toLocaleDateString()}</td>
            <td><button class="action-btn" onclick="openEditModal('${u.id}')">Edit</button></td>
          </tr>
        `).join('');

        pager.innerHTML = '';
        if (offset > 0) {
          const prev = document.createElement('button');
          prev.className = 'button secondary small';
          prev.textContent = 'Previous';
          prev.onclick = () => loadUsers(offset - PAGE_SIZE);
          pager.appendChild(prev);
        }
        if (meta.has_more) {
          const next = document.createElement('button');
          next.className = 'button secondary small';
          next.textContent = 'Next';
          next.onclick = () => loadUsers(offset + PAGE_SIZE);
          pager.appendChild(next);
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" class="muted">Unable to load users.</td></tr>';
      }
    }

    // ── Edit Modal ────────────────────────────────────────────────────────────

    async function openEditModal(userId) {
      _editingUserId = userId;
      const overlay = document.getElementById('editOverlay');
      const emailEl = document.getElementById('editEmail');
      const nameEl = document.getElementById('editBusinessName');
      const tierEl = document.getElementById('editTier');
      const statusEl = document.getElementById('editStatus');

      emailEl.textContent = 'Loading…';
      nameEl.value = '';
      statusEl.textContent = '';
      statusEl.className = 'edit-status';
      overlay.classList.remove('hidden');

      try {
        const user = await ApiClient.get(`/admin/users/${userId}`);
        emailEl.textContent = user.email || '(no email)';
        nameEl.value = user.business_name || '';
        tierEl.value = user.tier || 'free';
      } catch (err) {
        emailEl.textContent = 'Failed to load user.';
      }
    }

    function closeEditModal() {
      document.getElementById('editOverlay').classList.add('hidden');
      _editingUserId = null;
    }

    async function saveUser() {
      if (!_editingUserId) return;
      const saveBtn = document.getElementById('editSaveBtn');
      const statusEl = document.getElementById('editStatus');
      const business_name = document.getElementById('editBusinessName').value.trim();
      const tier = document.getElementById('editTier').value;

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      statusEl.textContent = '';
      statusEl.className = 'edit-status';

      try {
        await ApiClient.patch(`/admin/users/${_editingUserId}`, { tier, business_name });
        statusEl.textContent = 'Saved successfully.';
        statusEl.className = 'edit-status ok';
        loadUsers(_offset);
      } catch (err) {
        statusEl.textContent = err.message || 'Failed to save.';
        statusEl.className = 'edit-status err';
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Changes';
      }
    }

    async function resetPassword() {
      if (!_editingUserId) return;
      const resetBtn = document.getElementById('editResetBtn');
      const statusEl = document.getElementById('editStatus');

      if (!confirm('Send a temporary password to this user\'s email?')) return;

      resetBtn.disabled = true;
      resetBtn.textContent = 'Sending…';
      statusEl.textContent = '';
      statusEl.className = 'edit-status';

      try {
        const result = await ApiClient.post(`/admin/users/${_editingUserId}/reset-password`, {});
        statusEl.textContent = result.message || 'Temporary password sent.';
        statusEl.className = 'edit-status ok';
      } catch (err) {
        statusEl.textContent = err.message || 'Failed to reset password.';
        statusEl.className = 'edit-status err';
      } finally {
        resetBtn.disabled = false;
        resetBtn.textContent = 'Reset Password';
      }
    }

    // ── Bootstrap ─────────────────────────────────────────────────────────────

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof Auth === 'undefined') {
        document.getElementById('adminGate').innerHTML =
          '<p class="muted">Auth not available. <a href="/">Go to main tool</a>.</p>';
        return;
      }
      Auth.onAuthChange(({ loggedIn }) => {
        if (loggedIn) {
          loadAdminDashboard();
        } else {
          document.getElementById('adminGate').innerHTML =
            '<p class="muted">Please <a href="/">log in</a> with an admin account.</p>';
        }
      });
    });
  </script>
</body>
</html>
