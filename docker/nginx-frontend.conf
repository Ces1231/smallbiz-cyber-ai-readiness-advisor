server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # All API calls route through nginx to the backend — browser stays on the same origin
    # and never needs to know the backend's port.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        # Required for SSE streaming — prevents nginx from buffering AI advice chunks
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config: sets ADVISOR_API_URL to /api (relative) so auth.js and
    # api-client.js use the same-origin nginx proxy path regardless of host port.
    location = /config.js {
        default_type application/javascript;
        return 200 'window.ADVISOR_API_URL = "/api";';
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
